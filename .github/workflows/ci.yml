name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  research-data:
    name: Research data / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify public data and analysis
        run: make verify PYTHON=python

  postgres:
    name: PostgreSQL migrations and integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify schema, constraints, indexes, and queries
        run: make db-test

  node-api:
    name: Node.js API and PostgreSQL integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Compile and run request-level tests
        run: make api-test
      - name: Run API integration tests against PostgreSQL
        run: make api-integration-test
      - name: Build the production API image
        run: docker compose --profile application build api
      - name: Audit production dependencies
        run: npm audit --omit=dev
