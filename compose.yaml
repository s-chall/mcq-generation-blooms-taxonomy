name: blooms-taxonomy

services:
  postgres:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_DB: blooms
      POSTGRES_USER: blooms
      POSTGRES_PASSWORD: blooms-local-only
    ports:
      - "${BLOOMS_POSTGRES_PORT:-54329}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blooms -d blooms"]
      interval: 2s
      timeout: 3s
      retries: 15

  api:
    profiles: [application]
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://blooms:blooms-local-only@postgres:5432/blooms
      PORT: 3000
    ports:
      - "${BLOOMS_API_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - --input-type=module
        - --eval
        - fetch('http://localhost:3000/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 3s
      timeout: 3s
      retries: 15

  web:
    profiles: [application]
    build:
      context: .
      dockerfile: services/web/Dockerfile
    ports:
      - "${BLOOMS_WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 15

  migrate:
    image: postgres:17.6-bookworm
    profiles: [tools]
    working_dir: /workspace
    environment:
      DATABASE_URL: postgresql://blooms:blooms-local-only@postgres:5432/blooms
    volumes:
      - .:/workspace:ro
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "scripts/migrate.sh"]

  db-test:
    image: postgres:17.6-bookworm
    profiles: [tools]
    working_dir: /workspace
    environment:
      DATABASE_URL: postgresql://blooms:blooms-local-only@postgres:5432/blooms
    volumes:
      - .:/workspace:ro
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - psql
      - --set=ON_ERROR_STOP=1
      - --file=db/tests/schema_test.sql
      - postgresql://blooms:blooms-local-only@postgres:5432/blooms
