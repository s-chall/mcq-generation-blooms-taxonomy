name: blooms-taxonomy

services:
  postgres:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_DB: blooms
      POSTGRES_USER: blooms
      POSTGRES_PASSWORD: blooms-local-only
    ports:
      - "${BLOOMS_POSTGRES_PORT:-54329}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blooms -d blooms"]
      interval: 2s
      timeout: 3s
      retries: 15

  migrate:
    image: postgres:17.6-bookworm
    profiles: [tools]
    working_dir: /workspace
    environment:
      DATABASE_URL: postgresql://blooms:blooms-local-only@postgres:5432/blooms
    volumes:
      - .:/workspace:ro
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "scripts/migrate.sh"]

  db-test:
    image: postgres:17.6-bookworm
    profiles: [tools]
    working_dir: /workspace
    environment:
      DATABASE_URL: postgresql://blooms:blooms-local-only@postgres:5432/blooms
    volumes:
      - .:/workspace:ro
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - psql
      - --set=ON_ERROR_STOP=1
      - --file=db/tests/schema_test.sql
      - postgresql://blooms:blooms-local-only@postgres:5432/blooms
